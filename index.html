<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#12392e"><meta name="description" content="恐竜といっしょに地下10階をめざす、ゆっくり考えて遊べる冒険ゲーム。"><title>ジョーの大冒険</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a7753'/%3E%3Ctext x='6' y='25' font-size='26' fill='%23ffdc75'%3EJ%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><header class="topbar"><span class="brand">🧭 ジョーの大冒険</span><button id="sound" aria-label="音を切り替え">音 OFF</button></header><section id="town"></section><section id="adventure" hidden><div id="stats"></div><div class="map-wrap"><canvas id="map" aria-label="ダンジョン。画面下の方向キーで移動できます。"></canvas><span class="map-caption">あなたが動くと、敵も動く。</span><canvas id="minimap" aria-label="探索済みマップ"></canvas><div id="banner" role="status"></div></div><div id="messages" aria-live="polite"></div><div class="controls"><div class="dpad" aria-label="方向キー"><button data-move="-1,-1" aria-label="左上">↖</button><button data-move="0,-1" aria-label="上">↑</button><button data-move="1,-1" aria-label="右上">↗</button><button data-move="-1,0" aria-label="左">←</button><button data-action="wait" class="wait" aria-label="1ターン待つ">待つ</button><button data-move="1,0" aria-label="右">→</button><button data-move="-1,1" aria-label="左下">↙</button><button data-move="0,1" aria-label="下">↓</button><button data-move="1,1" aria-label="右下">↘</button></div><div class="actions"><button data-action="attack" class="attack">⚔️<span>こうげき</span></button><button id="bag">🎒<span>どうぐ</span></button><button data-action="inspect">🔎<span>足元</span></button><button id="pause">⏸<span>ひと休み</span></button></div></div></section><p id="save-error" role="alert"></p></main><dialog id="dialog"><div id="dialog-content"></div><button id="close-dialog" class="wide">とじる</button></dialog><script type="module" src="src/main.js"></script></body></html>
